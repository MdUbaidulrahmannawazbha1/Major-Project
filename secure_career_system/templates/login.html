<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure Career System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<style>
        :root {
            --bg-night: #071426;
            --bg-deep: #0f2c44;
            --accent: #ff7a18;
            --accent-2: #ffb347;
            --text-main: #f7fafc;
            --text-muted: #a8c2d8;
            --card: rgba(10, 23, 38, 0.76);
            --line: rgba(255, 255, 255, 0.15);
            --danger: #ff5f6d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: var(--text-main);
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 122, 24, 0.25), transparent 35%),
                radial-gradient(circle at 80% 85%, rgba(52, 211, 153, 0.18), transparent 40%),
                linear-gradient(145deg, var(--bg-night), var(--bg-deep));
            padding: 20px;
            overflow: hidden;
        }

        .orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.5;
            animation: drift 11s ease-in-out infinite;
        }

        .orb.one { width: 220px; height: 220px; background: rgba(255, 122, 24, 0.35); top: -40px; right: 7%; }
        .orb.two { width: 180px; height: 180px; background: rgba(16, 185, 129, 0.3); bottom: 4%; left: 8%; animation-delay: -3s; }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            padding: 34px;
            position: relative;
            z-index: 2;
            animation: reveal 500ms ease;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 30px;
            margin-bottom: 6px;
            letter-spacing: 0.4px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 15px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d6e7f5;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(255, 179, 71, 0.22);
            transform: translateY(-1px);
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #102132;
            cursor: pointer;
            background: linear-gradient(110deg, var(--accent), var(--accent-2));
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 25px rgba(255, 122, 24, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 122, 24, 0.45);
        }

        .error {
            color: #fff2f3;
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 95, 109, 0.2);
            border: 1px solid rgba(255, 95, 109, 0.45);
            font-size: 14px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .link a {
            color: #ffd099;
            text-decoration: none;
            font-weight: 600;
        }

        .link a:hover { text-decoration: underline; }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }

        @media (max-width: 520px) {
            .container { padding: 26px 20px; border-radius: 20px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="orbs" aria-hidden="true">
        <div class="orb one"></div>
        <div class="orb two"></div>
    </div>
    <div class="container">
        <h1>Login</h1>
        <p class="subtitle">Continue your AI-powered career journey.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="link">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></div>
    </div>
</body>
</html>
