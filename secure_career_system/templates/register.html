<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Secure Career System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<style>
        :root {
            --bg-night: #051523;
            --bg-deep: #12364d;
            --accent: #f97316;
            --accent-2: #fdba74;
            --text-main: #f8fafc;
            --text-muted: #a4bed2;
            --card: rgba(8, 27, 43, 0.78);
            --line: rgba(255, 255, 255, 0.16);
            --danger: #ff5f6d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: var(--text-main);
            background:
                radial-gradient(circle at 10% 12%, rgba(249, 115, 22, 0.25), transparent 36%),
                radial-gradient(circle at 84% 78%, rgba(6, 182, 212, 0.2), transparent 40%),
                linear-gradient(150deg, var(--bg-night), var(--bg-deep));
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            padding: 32px;
            animation: reveal 500ms ease;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 29px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 22px;
            font-size: 15px;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d6e6f4;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(253, 186, 116, 0.2);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #12263b;
            cursor: pointer;
            background: linear-gradient(110deg, var(--accent), var(--accent-2));
            box-shadow: 0 12px 25px rgba(249, 115, 22, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(249, 115, 22, 0.4);
        }

        .error {
            color: #fff2f3;
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 95, 109, 0.2);
            border: 1px solid rgba(255, 95, 109, 0.45);
            font-size: 14px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .link a {
            color: #ffd39f;
            text-decoration: none;
            font-weight: 600;
        }

        .link a:hover { text-decoration: underline; }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 520px) {
            .container { padding: 24px 20px; border-radius: 20px; }
            h1 { font-size: 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <p class="subtitle">Join the platform and build your next career move with AI.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <div class="link">Already have an account? <a href="{{ url_for('login') }}">Login here</a></div>
    </div>
</body>
</html>
