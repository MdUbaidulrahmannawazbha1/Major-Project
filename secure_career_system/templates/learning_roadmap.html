<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Roadmap - Career Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<style>
        :root {
            --ink: #0f172a;
            --ink-soft: #475569;
            --paper: #fffdfa;
            --line: #e6dfd6;
            --accent: #ea580c;
            --accent-2: #fb923c;
            --sky: #0369a1;
            --ok-bg: #dcfce7;
            --ok-text: #166534;
            --shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(circle at 6% 11%, rgba(234, 88, 12, 0.13), transparent 28%),
                radial-gradient(circle at 90% 24%, rgba(14, 165, 233, 0.12), transparent 30%),
                linear-gradient(180deg, #f8f6f3 0%, #f0ece6 100%);
            min-height: 100vh;
            color: var(--ink);
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 12;
            background: rgba(250, 246, 241, 0.9);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(8px);
            padding: 15px 0;
        }

        .navbar-container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .navbar h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; }

        .navbar a {
            color: var(--ink);
            text-decoration: none;
            margin-left: 8px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.65);
        }

        .container { max-width: 940px; margin: 0 auto; padding: 28px 20px; }

        .card {
            background: var(--paper);
            padding: 24px;
            border-radius: 18px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 8px;
            font-size: 29px;
        }

        p.sub { color: var(--ink-soft); margin-bottom: 18px; line-height: 1.55; }

        label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--ink-soft); }

        input, select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d8dbe1;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 14px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.2);
        }

        .btn {
            background: linear-gradient(110deg, var(--accent), var(--accent-2));
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(234, 88, 12, 0.24);
        }

        .phase-card {
            border: 1px solid var(--line);
            background: #ffffff;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--sky);
        }

        .phase-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
        .phase-num { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--sky); font-weight: 700; }
        .phase-title { font-size: 20px; font-weight: 700; color: var(--ink); margin: 2px 0; }
        .phase-duration { font-size: 12px; background: var(--sky); color: white; padding: 4px 10px; border-radius: 999px; }
        .topic-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0; }
        .topic-chip { background: #f8fafc; border: 1px solid var(--line); padding: 4px 11px; border-radius: 999px; font-size: 13px; color: var(--ink-soft); }
        .resource-title { font-size: 13px; color: #6b7280; margin: 10px 0 5px; font-weight: 700; }
        .res-link { font-size: 13px; color: var(--sky); display: block; margin-bottom: 4px; }
        .milestone-box { background: var(--ok-bg); border-radius: 10px; padding: 10px 13px; margin-top: 12px; }
        .milestone-box strong { color: var(--ok-text); }

        .summary-bar {
            background: linear-gradient(115deg, #0f172a, #0369a1);
            color: white;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back-link { color: var(--sky); text-decoration: none; font-size: 14px; font-weight: 600; }
        .result-section { display: none; }
        .monthly-step { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e7e7e7; }
        .month-tag { background: linear-gradient(110deg, var(--accent), var(--accent-2)); color: white; width: 66px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }

        @media (max-width: 640px) {
            .card { padding: 18px 14px; }
            h2 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-container">
            <h1>AI Career Navigation</h1>
            <div><a href="/dashboard">Dashboard</a><a href="/logout">Logout</a></div>
        </div>
    </div>

    <div class="container">
        <a href="/dashboard" class="back-link">â† Back to Dashboard</a><br><br>
        <div class="card">
            <h2>AI Personal Learning Engine</h2>
            <p class="sub">Get a structured, phase-by-phase learning roadmap personalised to your career goal and current level.</p>

            <label>Career Goal</label>
            <input type="text" id="careerGoal" value="{{ career_goal }}" placeholder="e.g. AI Engineer, Data Scientist, IAS Officer">

            <label>Education Level</label>
            <select id="eduLevel">
                <option value="School">School</option>
                <option value="PUC">PUC / Class 12</option>
                <option value="Undergraduate">Undergraduate</option>
                <option value="Postgraduate">Postgraduate</option>
                <option value="PhD">PhD</option>
                <option value="Professional">Working Professional</option>
            </select>

            <label>Current Skills (comma-separated)</label>
            <input type="text" id="skills" placeholder="e.g. python, sql, machine learning">

            <label>Career Switch From (optional â€” leave blank if not switching careers)</label>
            <input type="text" id="switchFrom" placeholder="e.g. Mechanical Engineering, Finance">

            <button class="btn" onclick="getRoadmap()">Generate Learning Roadmap</button>
        </div>

        <div class="result-section" id="resultSection">
            <div class="summary-bar">
                <div>
                    <div style="font-size:13px; opacity:0.85;" id="summaryMsg"></div>
                    <div id="summaryCareer" style="font-size:22px; font-weight:700;"></div>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:13px; opacity:0.85;">Total Duration</div>
                    <div id="summaryDuration" style="font-size:20px; font-weight:700;"></div>
                </div>
            </div>
            <div id="roadmapContent"></div>
        </div>

        {% if roadmap_data %}
        <script id="roadmapData" type="application/json">{{ roadmap_data | tojson }}</script>
        {% endif %}
    </div>

    <script>
    async function getRoadmap() {
        const payload = {
            career_goal: document.getElementById('careerGoal').value,
            education_level: document.getElementById('eduLevel').value,
            skills: document.getElementById('skills').value.split(',').map(s=>s.trim()).filter(Boolean),
            career_switch_from: document.getElementById('switchFrom').value || null,
        };

        const resp = await fetch('/api/learning-roadmap', {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload),
        });
        const data = await resp.json();
        renderRoadmap(data);
    }

    function renderRoadmap(data) {
        document.getElementById('summaryMsg').textContent = data.type === 'career_switch' ? 'Career Switch Roadmap' : 'Phased Learning Roadmap';
        document.getElementById('summaryCareer').textContent = data.type === 'career_switch'
            ? `${data.from} â†’ ${data.to}` : (data.career_goal || '');
        document.getElementById('summaryDuration').textContent = data.total_months + ' months';

        let html = '';
        if (data.type === 'career_switch') {
            html = data.monthly_roadmap.map(step => `
                <div class="monthly-step">
                    <div class="month-tag">Month ${step.month}</div>
                    <div style="padding-top:4px; color:#444;">${step.focus}</div>
                </div>`).join('');
        } else {
            html = (data.phases || []).map(phase => `
                <div class="phase-card">
                    <div class="phase-header">
                        <div>
                            <div class="phase-num">Phase ${phase.phase}</div>
                            <div class="phase-title">${phase.title}</div>
                        </div>
                        <span class="phase-duration">${phase.duration}</span>
                    </div>
                    <div class="topic-list">
                        ${phase.topics.map(t=>`<span class="topic-chip">${t}</span>`).join('')}
                    </div>
                    <div class="resource-title">Resources</div>
                    ${phase.resources.map(r=>`<span class="res-link">â†’ ${r}</span>`).join('')}
                    <div class="milestone-box">
                        <strong>Milestone:</strong> ${phase.milestone}
                    </div>
                </div>`).join('');
        }

        document.getElementById('roadmapContent').innerHTML = html;
        document.getElementById('resultSection').style.display = 'block';
        document.getElementById('resultSection').scrollIntoView({behavior:'smooth'});
    }

    window.addEventListener('load', () => {
        const roadmapDataEl = document.getElementById('roadmapData');
        if (roadmapDataEl && roadmapDataEl.textContent.trim()) {
            renderRoadmap(JSON.parse(roadmapDataEl.textContent));
        }
    });
    </script>
</body>
</html>
